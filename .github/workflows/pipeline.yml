name: pipeline

# Production orchestrator. Zillow refreshes its research CSVs around the middle of each month
# (the September 2026 vintage was published on the 16th), so the scheduled run fires on the
# 18th. Runs are idempotent: unchanged sources are skipped by ETag/checksum, so a manual
# re-run costs no sandbox storage.

on:
  schedule:
    - cron: "0 9 18 * *"
  workflow_dispatch:
    inputs:
      deployment:
        description: "BigQuery deployment (dbt target): sandbox | prod"
        type: choice
        options: [sandbox, prod]
        default: sandbox
      profile:
        description: "Catalog profile: core | extended"
        type: choice
        options: [core, extended]
        default: core
      force:
        description: "Reload every source even if unchanged"
        type: boolean
        default: false
      only:
        description: "Space-separated dataset keys to (re)load; empty = whole profile"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false # never interrupt a load mid-flight

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.12"
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  DBT_PROJECT_DIR: ${{ github.workspace }}/dbt

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # alert when a scheduled run finds no usable credential
    outputs:
      mode: ${{ steps.auth.outputs.mode }}
      project: ${{ steps.auth.outputs.project }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: choose the auth method (WIF > key > none)
        env:
          HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: python3 src/proptech/ci_auth.py
      - name: no credential configured
        if: steps.auth.outputs.mode == 'none'
        env:
          REASON: ${{ steps.auth.outputs.reason }}
        run: echo "::notice title=Pipeline skipped::$REASON"
      - name: alert on a scheduled run without credentials
        if: steps.auth.outputs.mode == 'none' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.auth.outputs.reason }}
        with:
          script: |
            const title = 'Pipeline credentials missing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled run ${run} was skipped: ${process.env.REASON}.\n\n` +
              'Restore the credential (docs/gcp_setup.md), then run Actions -> pipeline -> Run workflow.';
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'pipeline-failure' });
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['pipeline-failure'] });

  run:
    needs: preflight
    if: needs.preflight.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.deployment || 'sandbox' }}
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
      issues: write # failure alerts
    env:
      PROPTECH_TARGET: bigquery
      PROPTECH_ENV: ${{ inputs.deployment || 'sandbox' }}
      PROPTECH_PROFILE: ${{ inputs.profile || 'core' }}
      PROPTECH_BQ_PROJECT: ${{ needs.preflight.outputs.project }}
      AUTH_MODE: ${{ needs.preflight.outputs.mode }}
      PROPTECH_BQ_LOCATION: ${{ vars.GCP_LOCATION || 'US' }}
      PROPTECH_RAW_ARCHIVE_URI: ${{ vars.RAW_ARCHIVE_URI || format('{0}/data/archive', github.workspace) }}
      DBT_TARGET: ${{ inputs.deployment || 'sandbox' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # google-github-actions/auth takes exactly one method, so pass only the selected one.
      - name: authenticate (Workload Identity Federation, keyless)
        if: env.AUTH_MODE == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: authenticate (service-account key)
        if: env.AUTH_MODE == 'key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: default the project to the credentials' project
        run: |
          if [[ -z "$PROPTECH_BQ_PROJECT" ]]; then echo "PROPTECH_BQ_PROJECT=$GOOGLE_CLOUD_PROJECT" >> "$GITHUB_ENV"; fi
      - run: uv sync
      - name: credential health check
        id: health
        run: uv run proptech --no-json-logs healthcheck --out data/health.md
      - name: record start time
        id: start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"

      - name: storage budget gate
        run: uv run proptech budget --fail-above 0.95

      - name: ingest
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          for key in $ONLY; do args+=(--only "$key"); done
          uv run proptech ingest $FORCE "${args[@]}" --summary-json data/ingest-summary.json

      - run: uv run dbt deps
      - name: dbt source freshness
        run: uv run dbt source freshness
      - name: dbt build
        run: uv run dbt build
      - name: record dbt storage in the ledger
        if: always()
        run: uv run proptech budget --record-dbt-since "${{ steps.start.outputs.ts }}" --run-id "gha-${{ github.run_id }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-${{ github.run_id }}
          path: |
            data/ingest-summary.json
            dbt/target/run_results.json
            dbt/target/sources.json
            dbt/target/manifest.json

      - name: open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        env:
          HEALTH_FAILED: ${{ steps.health.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const credential = process.env.HEALTH_FAILED === 'true';
            const mode = process.env.AUTH_MODE === 'wif' ? 'Workload Identity Federation' : 'GCP_SA_KEY secret';
            const title = credential
              ? `Pipeline credential failure (${mode})`
              : `Pipeline failure: ${process.env.PROPTECH_ENV}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `Run ${run} failed at ${new Date().toISOString()}.`;
            if (credential && fs.existsSync('data/health.md')) body += '\n\n' + fs.readFileSync('data/health.md', 'utf8');
            body += '\n\nSee docs/runbook.md.';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'pipeline-failure',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['pipeline-failure'] });
            }
