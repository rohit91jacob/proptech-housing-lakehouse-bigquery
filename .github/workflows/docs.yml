name: docs

# Publishes the dbt docs site (built from the fixture pipeline on DuckDB) to GitHub Pages.
# Opt-in: set the repository variable DEPLOY_DOCS=true after enabling Pages with
# "Source: GitHub Actions" (Settings -> Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.DEPLOY_DOCS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
      DBT_TARGET: local
      PROPTECH_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/docs.duckdb
      PROPTECH_RAW_ARCHIVE_URI: ${{ github.workspace }}/data/archive
      PROPTECH_ZILLOW_BASE_URL: file://${{ github.workspace }}/tests/fixtures/sources/zillow
      PROPTECH_PMMS_URL: file://${{ github.workspace }}/tests/fixtures/sources/pmms/PMMS_history.csv
      PROPTECH_ACS_BASE_URL: file://${{ github.workspace }}/tests/fixtures/sources/acs
      PROPTECH_RELAXED_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run proptech --no-json-logs ingest
      - run: uv run dbt deps
      - run: |
          uv run dbt build --vars '{max_unmapped_peer_share: 0.25}'
      - run: uv run dbt docs generate --static
      - run: mkdir -p site && cp dbt/target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
