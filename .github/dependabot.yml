version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dbt:
        patterns: ["dbt-*"]
      google:
        patterns: ["google-*"]
    ignore:
      # dbt-bigquery constrains google-cloud-storage; bumps follow dbt-bigquery upgrades.
      - dependency-name: google-cloud-storage
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v7 broke the workflow in CI; revisit deliberately
      - dependency-name: astral-sh/setup-uv
        versions: [">=7"]
      # v5 broke the Pages deploy in CI; revisit deliberately
      - dependency-name: actions/deploy-pages
        versions: [">=5"]
      # v4+ broke the Pages deploy in CI; revisit deliberately
      - dependency-name: actions/upload-pages-artifact
        versions: [">=4"]
