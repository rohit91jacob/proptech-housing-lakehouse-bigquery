version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dbt:
        patterns: ["dbt-*"]
      google:
        patterns: ["google-*"]
    ignore:
      # dbt-bigquery constrains google-cloud-storage; bumps follow dbt-bigquery upgrades.
      - dependency-name: google-cloud-storage
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
