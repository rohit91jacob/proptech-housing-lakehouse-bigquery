[project]
name = "proptech-housing"
version = "0.1.0"
description = "Production-grade ELT for US housing-market data: Zillow Research + Freddie Mac PMMS + Census ACS into BigQuery with dbt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "rohit91jacob" }]
dependencies = [
    "requests>=2.32,<3",
    "urllib3>=2.2,<3",
    "polars>=1.30,<3",
    "pyarrow>=18",
    "duckdb>=1.3,<2",
    "google-cloud-bigquery>=3.30,<4",
    "google-cloud-storage>=2.18,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
proptech = "proptech.cli:app"

[dependency-groups]
dbt = [
    "dbt-core>=1.10,<1.13",
    "dbt-bigquery>=1.10,<1.13",
    "dbt-duckdb>=1.10,<1.12",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.9",
    "sqlfluff>=3.3,<5",
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dbt", "dev"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proptech"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PL"]
ignore = [
    "PLR0913", # CLI entrypoints legitimately take many options
    "PLR2004", # magic values are fine in data validation thresholds
    "PLC0415", # backends import their SDKs lazily so DuckDB-only installs stay light
]

[tool.ruff.lint.pylint]
# The ingest steps are linear fetch/validate/load sequences; splitting them hides the flow.
max-returns = 10
max-branches = 25
max-statements = 80

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT018"]  # asserts and literal thresholds are the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "bigquery: needs real GCP credentials (skipped unless PROPTECH_BQ_PROJECT is set)",
]

[tool.coverage.run]
source = ["proptech"]
branch = true
