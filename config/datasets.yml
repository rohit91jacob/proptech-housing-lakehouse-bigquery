# Catalog of source datasets. Single source of truth for ingestion, validation and the
# generated dbt sources file (`proptech dbt-sources`). Paths are relative to
# PROPTECH_ZILLOW_BASE_URL (default https://files.zillowstatic.com/research/public_csvs).
#
# kind:        timeseries (wide month columns) | forecast (BaseDate + horizon columns)
# geography:   the dominant RegionType in the file (metro files also carry a "country" row)
# unit:        usd | usd_per_month | count | ratio | percent | index | days
# profiles:    core (sandbox-friendly, ~40 MB of CSV) | extended (adds city/ZIP, ~400 MB)
# min_regions: lower bound on rows; a smaller file is treated as a truncated download
# value_range: inclusive bounds every non-null value must satisfy

defaults:
  smoothed: true
  seasonally_adjusted: false
  profiles: [core, extended]

datasets:
  # ---------------------------------------------------------------- home values (ZHVI)
  - key: zhvi_metro_mid_all
    family: zhvi
    metric: home_value
    path: zhvi/Metro_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv
    geography: metro
    unit: usd
    tier: mid
    property_type: sfrcondo
    seasonally_adjusted: true
    min_regions: 800
    value_range: [1000, 100000000]
    description: Typical home value (35th-65th percentile), all homes, smoothed & seasonally adjusted.
  - key: zhvi_metro_bottom_all
    family: zhvi
    metric: home_value
    path: zhvi/Metro_zhvi_uc_sfrcondo_tier_0.0_0.33_sm_sa_month.csv
